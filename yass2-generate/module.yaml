product:
  type: kmp/lib
  platforms: [ jvm ]

apply:
  - //yass.module-template.yaml

dependencies@jvm:
  - //yass2-serialize
  - //yass2-remote
  - $kotlin.reflect
  - $libs.ksp: compile-only

test-dependencies@jvm:
  - $libs.kct

test-settings@jvm:
  kotlin:
    ksp:
      processors:
        - //yass2-generate
      processorOptions:
        yass.GenerateMode: InRepository
