on:
  workflow_dispatch:
jobs:
  release:
    uses: ./.github/workflows/common.yml
    secrets: inherit
    with:
      script: |
        mkdir -p ~/.gradle
        # printenv prevents that secrets are visible on the command line
        printenv GRADLE_PROPERTIES             > ~/.gradle/gradle.properties
        printenv MAVEN_CENTRAL_KEY | base64 -d > ~/.gradle/maven.central.key.gpg
        ./gradlew -Pversion=`git describe` markers build publishToMavenCentral
